# Crash auto-recovery + capture (install to /etc/sysctl.d/60-crash-capture.conf).
# Pairs with kdump-tools: a panic triggers the kdump kernel (vmcore → /var/crash),
# THEN the box reboots after the delay below. Without this, snf hangs on a panic
# instead of rebooting (see the Jun 14 freeze: no shutdown, no trace).

# Reboot 10s after a panic (kdump captures first, then this reboots).
kernel.panic = 10

# Escalate a kernel oops to a full panic so it's captured + auto-recovers.
kernel.panic_on_oops = 1

# A task stuck uninterruptible (D state) past the timeout → panic. Catches the
# I/O-stall / freeze class the Jun 14 crash looked like (cloudflared/dockerd stalls
# right before death). 120s is generous to avoid firing on transient heavy I/O.
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 120

# NOT enabled: kernel.softlockup_panic. On this box (15 containers + 3 postgres)
# a CPU softlockup is more likely a transient stall than a real fault; panicking
# on it would cause spurious reboots. Enable only if freezes recur and hung_task
# doesn't catch them.
